<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 620" width="390" height="620" role="img" aria-labelledby="title desc" font-family="ui-rounded,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" stroke-linecap="round" stroke-linejoin="round"><title id="title">程式碼庫</title><desc id="desc">倒金字塔由上到下分成五層，越下層越窄，左側成本箭頭向下，表示越往下成本越高。依序為程式碼庫：好的 API 設計、架構、重構；靜態分析：lint、型別、編譯器、測試、CI；驗證：形式驗證、執行期驗證；散文：規則、skills、AGENTS.md；人工審查。前兩層苔綠、驗證天藍、散文柿橘、人工審查莓紅。</desc><defs><marker id="arrow-2B2F3A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#2B2F3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-5E8F5A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#5E8F5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-D9534F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#D9534F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-5DAEE0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#5DAEE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-F08A3C" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#F08A3C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.75" y="0.75" width="388.5" height="618.5" rx="20" fill="#FFF7E6" stroke="#E7D9BC" stroke-width="1.5" /><g id="layer-1" ><path d="M 72.0 38 L 372.0 38 L 358.0 136 Q 222 139 86.0 136 Z" fill="#E2ECD5" stroke="#5E8F5A" stroke-