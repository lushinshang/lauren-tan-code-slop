<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 760" width="390" height="760" role="img" aria-labelledby="title desc" font-family="ui-rounded,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" stroke-linecap="round" stroke-linejoin="round"><title id="title">低信任</title><desc id="desc">兩個順時針迴圈由中央箭頭連接，低信任轉向高信任。低信任：多數人卡在這裡，agent 寫出 slop 程式碼、人來驗證、發現問題，反覆循環；旁邊園丁獺露出懷疑表情。高信任：你想到達這裡，agent 寫出好程式碼、agent 來驗證、發現問題，反覆循環；園丁獺露出得意表情。自動化之前，先把迴圈改好。</desc><defs><marker id="arrow-2B2F3A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#2B2F3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-5E8F5A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#5E8F5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-D9534F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#D9534F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-5DAEE0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#5DAEE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-F08A3C" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#F08A3C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.75" y="0.75" width="388.5" height="758.5" rx="20" fill="#FFF7E6" stroke="#E7D9BC" stroke-width="1.5" /><g id="loop-1" ><text x="195" y="48" font-size="24" text-anchor="middle" font-weight="700" fill="#2B2F3A">低信任</text><text x