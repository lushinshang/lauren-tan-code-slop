<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 620" width="390" height="620" role="img" aria-labelledby="title desc" font-family="ui-rounded,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" stroke-linecap="round" stroke-linejoin="round"><title id="title">功能地圖</title><desc id="desc">功能地圖放在圓角框內。樹狀圖從一個淡灰起點連到一個橘色節點，再分成上下兩條支線，各連到一個綠色終點。小苗站在橘色節點上。三個層次的標籤為有哪些功能、使用者怎麼到達、什麼能證明它可用；手機版把層次由上往下排列，標籤與對應層對齊。</desc><defs><marker id="arrow-2B2F3A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#2B2F3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-5E8F5A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#5E8F5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-D9534F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#D9534F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-5DAEE0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#5DAEE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-F08A3C" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#F08A3C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.75" y="0.75" width="388.5" height="618.5" rx="20" fill="#FFF7E6" stroke="#E7D9BC" stroke-width="1.5" /><rect x="20" y="24" width="350" height="570" rx="20" fill="#FFF7E6" stroke="#E7D9BC" stroke-width="2" /><text x="195" y="67" font-size="25" text-anchor="middle" font-weight="700" fill="#2B2F3A">功能地圖</text><g id="connections" ><path d="M 100 166 L 100 181 Q 100 194 77 194 L 65 194 Q 45 194 45 214 L 45 269 Q 45 286 60 286 L 78 286" fill="none" stroke="#5DAEE0" stroke-width="3" marker-end="url(#arrow-5DAEE0)"/><path d="M 100 307 L 100 372 Q 100 393 68 393 L 68 441" fill="none" stroke="#5DAEE0" stroke-width="3" marker-end="url(#arrow-5DAEE0)"/><path d="M 100 372 Q 100 393 138 393 L 138 441" fill="none" stroke="#5DAEE0" stroke-width="3" marker-end="url(#arrow-5DAEE0)"/></g><g id="node-1" ><circle cx="100" cy="145" r="21" fill="#DAD5C8" stroke="#2B2F3A" stroke-width="3"/></g><g id="node-2" ><circle cx="100" cy="286" r="21" fill="#F08A3C" stroke="#2B2F3A" stroke-width="3"/></g><g id="node-3" ><circle cx="68" cy="463" r="21" fill="#5E8F5A" stroke="#2B2F3A" stroke-width="3"/></g><g id="node-4" ><circle cx="138" cy="463" r="21" fill="#5E8F5A" stroke="#2B2F3A" stroke-width="3"/></g><g id="seedling" ><g transform="translate(100 265) scale(0.77)"><g transform=""><path d="M -19 -13 Q -26 -35 -8 -48 Q 1 -53 10 -46 Q 30 -30 20 -11 Q 12 1 0 -2 Q -14 3 -19 -13 Z" fill="#5E8F5A" stroke="#2B2F3A" stroke-width="3" /><path d="M -1 -49 Q -30 -79 -30 -51 Q -20 -40 -1 -49 M 1 -49 Q 30 -79 30 -51 Q 20 -40 1 -49" fill="#5E8F5A" stroke="#2B2F3A" stroke-width="3" /><path d="M -12 -1 L -16 3 M 12 -1 L 16 3" fill="none" stroke="#2B2F3A" stroke-width="3" /><circle cx="-7" cy="-27" r="3" fill="#2B2F3A" stroke="none" stroke-width="3"/><circle cx="8" cy="-27" r="3" fill="#2B2F3A" stroke="none" stroke-width="3"/><path d="M -3 -18 Q 1 -14 5 -18" fill="none" stroke="#2B2F3A" stroke-width="2" /></g></g></g><text x="240" y="151" font-size="18" text-anchor="middle" font-weight="600" fill="#2B2F3A">有哪些功能</text><text x="240" y="305" font-size="18" text-anchor="middle" font-weight="600" fill="#2B2F3A"><tspan x="240" dy="0">使用者</tspan><tspan x="240" dy="27.0">怎麼到達</tspan></text><text x="240" y="470" font-size="18" text-anchor="middle" font-weight="600" fill="#2B2F