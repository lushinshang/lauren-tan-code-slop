<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="ui-rounded,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" stroke-linecap="round" stroke-linejoin="round"><title id="title">一個權宜之計</title><desc id="desc">原創園丁獺拿著橡皮章，章柄與章面有小苗圖案。第一株歪掉的小苗代表一個權宜之計；它被蓋印複製，後面四株都同樣傾斜，合成一排五株。三個複製箭頭推進到變成慣例。每次複製，都讓下一次更容易發生。</desc><defs><marker id="arrow-2B2F3A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#2B2F3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-5E8F5A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#5E8F5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-D9534F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#D9534F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-5DAEE0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#5DAEE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-F08A3C" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#F08A3C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="558.5" rx="20" fill="#FFF7E6" stroke="#E7D9BC" stroke-width="1.5" /><g id="gardener-and-stamp" ><g transform="translate(120 250) scale(1.0)"><path d="M 39 48 Q 74 42 62 69 Q 48 81 31 65" fill="#9A7B5B" stroke="#2B2F3A" stroke-width="3" /><path