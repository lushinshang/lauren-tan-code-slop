<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="title desc" font-family="ui-rounded,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" stroke-linecap="round" stroke-linejoin="round"><title id="title">5 月 → 現在</title><desc id="desc">5 月到現在的十五項效能對照，分五組。啟動，冷啟動：2,304 → 1,395 ms，變化 −39%，變快；啟動，重新啟動：1,348 → 829 ms，變化 −39%，變快；啟動，首次繪製（冷）：2,268 → 1,379 ms，變化 −39%，變快；輸入，短聊天（中位數）：3.8 → 2.8 ms，變化 −26%，變快；輸入，長聊天（中位數）：8.4 → 2.9 ms，變化 −65%，變快；輸入，長聊天（p90）：9.7 → 3.4 ms，變化 −65%，變快；開啟，設定頁：112 → 92 ms，變化 −18%，變快；開啟，長聊天（冷）：153 → 165 ms，變化 +8%，變慢或資源增加；開啟，長聊天（熱）：138 → 86 ms，變化 −38%，變快；切換與縮放，切到短聊天：88 → 49 ms，變化 −44%，變快；切換與縮放，回到長聊天：105 → 63 ms，變化 −40%，變快；切換與縮放，縮放視窗：3.0 → 6.9 ms，變化 +130%，變慢或資源增加；資源，閒置記憶體：488 → 545 MiB，變化 +12%，變慢或資源增加；資源，閒置 CPU：0.40% → 0.80%，變化 +100%，變慢或資源增加；資源，啟動時 js+css：2.0 → 7.7 MB，變化 +285%，變慢或資源增加。圖例苔綠為變快、莓紅為變慢。每列的短條以中線為零，變快朝左、變慢朝右；長度按變化率絕對值成比例，+285% 是最長。變化率使用資料檔中的已四捨五入數值。</desc><defs><marker id="arrow-2B2F3A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#2B2F3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-5E8F5A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#5E8F5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-D9534F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#D9534F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-5DAEE0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#5DAEE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker