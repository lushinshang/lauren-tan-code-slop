<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="ui-rounded,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" stroke-linecap="round" stroke-linejoin="round"><title id="title">每次糾正 agent</title><desc id="desc">每次糾正 agent，寫 lint 擋下它，或從根本消除問題。綠色階梯從零起算，依序升到 7、17、38、90、139、149、157、167。依 JSON 的約略日期，位置依序為 7 月中、8 月初、8 月中、9 月初、9 月中、9 月底、10 月中、10 月底；日期是估計，並非逐點觀測資料。橫軸五個月初刻度為 7 月 1 日、8 月 1 日、9 月 1 日、10 月 1 日、11 月 1 日。投影片未標單位，縱軸沒有名稱或刻度文字。</desc><defs><marker id="arrow-2B2F3A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#2B2F3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-5E8F5A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#5E8F5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-D9534F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#D9534F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-5DAEE0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#5DAEE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-F08A3C" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#F08A3C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="558.5" rx="20" fill="#FFF7E6" stroke="#E7D9BC" stroke-width="1.5" /><text x="40" y="53" font-size="28" text-anch