<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc" font-family="ui-rounded,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" stroke-linecap="round" stroke-linejoin="round"><title id="title">功能地圖</title><desc id="desc">功能地圖放在圓角框內。樹狀圖從一個淡灰起點連到一個橘色節點，再分成上下兩條支線，各連到一個綠色終點。小苗站在橘色節點上。三個層次的標籤為有哪些功能、使用者怎麼到達、什麼能證明它可用；手機版把層次由上往下排列，標籤與對應層對齊。</desc><defs><marker id="arrow-2B2F3A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#2B2F3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-5E8F5A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#5E8F5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-D9534F" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#D9534F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-5DAEE0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#5DAEE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-F08A3C" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#F08A3C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="558.5" rx="20" fill="#FFF7E6" stroke="#E7D9BC" stroke-width="1.5" /><rect x="34" y="35" width="892" height="485" rx="20" fill="#FFF7E6" stroke="#E7D9BC" stroke-width="2" /><text x="480" y="83" font-size="30" text-anchor="middle" font-weight="700" fill="#2B2F3A">功能地圖</text><g id="connections" ><path d="M 204 285 L 429 285" fill="none" stroke="#5DAEE0" stroke-width="3" marker-end="url(#arrow-5DAEE0)"/><path d="M 489 285 L 578 285 Q 610 285 610 245 L 610 214 Q 610 197 633 197 L 742 197" fill="none" stroke="#5DAEE0" stroke-width="3" marker-end="url(#arrow-5DAEE0)"/><path d="M 578 285 Q 610 285 610 325 L 610 358 Q 610 375 633 375 L 742 375" fill="none" stroke="#5DAEE0" stroke-width="3" marker-end="url(#arrow-5DAEE0)"/></g><g id="node-1" ><circle cx="175" cy="285" r="28" fill="#DAD5C8" stroke="#2B2F3A" stroke-width="3"/></g><g id="node-2" ><circle cx="460" cy="285" r="28" fill="#F08A3C" stroke="#2B2F3A" stroke-width="3"/></g><g id="node-3" ><circle cx="772" cy="197" r="28" fill="#5E8F5A" stroke="#2B2F3A" stroke-width="3"/></g><g id="node-4" ><circle cx="772" cy="375" r="28" fill="#5E8F5A" stroke="#2B2F3A" stroke-width="3"/></g><g id="seedling" ><g transform="translate(460 256) scale(1.05)"><g transform=""><path d="M -19 -13 Q -26 -35 -8 -48 Q 1 -53 10 -46 Q 30 -30 20 -11 Q 12 1 0 -2 Q -14 3 -19 -13 Z" fill="#5E8F5A" stroke="#2B2F3A" stroke-width="3" /><path d="M -1 -49 Q -30 -79 -30 -51 Q -20 -40 -1 -49 M 1 -49 Q 30 -79 30 -51 Q 20 -40 1 -49" fill="#5E8F5A" stroke="#2B2F3A" stroke-width="3" /><path d="M -12 -1 L -16 3 M 12 -1 L 16 3" fill="none" stroke="#2B2F3A" stroke-width="3" /><circle cx="-7" cy="-27" r="3" fill="#2B2F3A" stroke="none" stroke-width="3"/><circle cx="8" cy="-27" r="3" fill="#2B2F3A" stroke="none" stroke-width="3"/><path d="M -3 -18 Q 1 -14 5 -18" fill="none" stroke="#2B2F3A" stroke-width="2" /></g></g></g><text x="175" y="468" font-size="22" text-anchor="middle" font-weight="600" fill="#2B2F3A">有哪些功能</text><text x="460" y="468" font-size="22" text-anchor="middle" font-weight="600" fill="#2B2F3A">使用者怎麼到達</text><text x="772" y="468" font-size="22" text-anchor="middle" font-weight="600" fill="#2B2F3A">什麼能證明它可用</text></svg>
